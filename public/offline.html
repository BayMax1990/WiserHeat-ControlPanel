<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e8ecf0">
  <title>Can't reach your heating</title>
  <style>
    /* Shown by the service worker when the panel can't be reached. Self-contained: nothing else loads. */
    :root { --bg: #e8ecf0; --panel: #f7f9fb; --ink: #16202b; --ink-2: #485463; --line: #d2d9e1; --warm: #e0662e; color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f141a; --panel: #171e27; --ink: #e7ecf2; --ink-2: #a8b2bf; --line: #2b3542; --warm: #ec6a3c; color-scheme: dark; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
      background: var(--bg); color: var(--ink);
      font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    .card { width: min(400px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 26px 24px 22px; }
    svg { width: 34px; height: 34px; color: var(--warm); fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    h1 { font-size: 22px; line-height: 1.25; margin: 12px 0 8px; letter-spacing: -.01em; }
    p { margin: 0 0 10px; color: var(--ink-2); }
    ul { margin: 0 0 16px; padding-left: 20px; color: var(--ink-2); }
    button {
      width: 100%; padding: 11px; border: 0; border-radius: 12px; cursor: pointer;
      background: var(--ink); color: var(--panel); font-family: inherit; font-size: 15px; font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="card">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4"/></svg>
    <h1>Can't reach your heating</h1>
    <p>This phone can't reach the heating panel at the moment. Check that:</p>
    <ul>
      <li>you're on your home Wi-Fi, or connected to your home VPN (such as Tailscale) if you're out;</li>
      <li>the computer, server or Home Assistant running the panel is switched on.</li>
    </ul>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>
    // Try again by itself as soon as the phone is back online.
    addEventListener('online', () => location.reload());
  </script>
</body>
</html>
